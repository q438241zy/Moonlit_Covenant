<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>角色管理系统 — 月蚀契约</title>
<style>
:root {
  --bg: #0c0b1b; --surface: #14132a; --card: #1a1838;
  --line: #2a2850; --text: #e8e4f0; --muted: #8b87a8;
  --faint: #5c5880; --accent-lia: #ff6b7c; --accent-mia: #5ed7ff;
  --accent-serena: #b58cff; --accent-freya: #8fd4f5; --accent-lilith: #c084fc;
  --accent-evelyn: #facc15; --accent-ophelia: #f472b6; --accent-ayla: #fbbf24;
  --success: #4ade80; --warn: #fbbf24; --danger: #f87171;
  --radius: 12px; --shadow: 0 8px 32px rgba(0,0,0,.45);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif;
  min-height: 100vh; line-height: 1.6;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

.app { max-width: 1400px; margin: 0 auto; padding: 16px 24px; }

/* Header */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 0; border-bottom: 1px solid var(--line); margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
}
.header h1 { font-size: 1.55rem; letter-spacing: .5px; }
.header h1 span { color: var(--accent-serena); }
.header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

/* Tabs */
.tabs { display: flex; gap: 4px; margin-bottom: 24px; flex-wrap: wrap; }
.tab-btn {
  padding: 10px 22px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--surface); color: var(--muted); cursor: pointer;
  font-size: .88rem; transition: all .2s; white-space: nowrap;
}
.tab-btn:hover { border-color: var(--accent-serena); color: var(--text); }
.tab-btn.active { background: var(--accent-serena); color: #fff; border-color: var(--accent-serena); }

/* Buttons */
.button {
  padding: 8px 18px; border-radius: 99px; border: 1px solid var(--line);
  background: var(--surface); color: var(--text); cursor: pointer;
  font-size: .84rem; transition: all .18s; white-space: nowrap;
}
.button:hover { border-color: var(--accent-serena); }
.button.primary { background: var(--accent-serena); color: #fff; border-color: transparent; }
.button.primary:hover { filter: brightness(1.15); }
.button.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.button.small { padding: 5px 12px; font-size: .76rem; }

/* Tab content */
.tab-content { display: none; animation: fadeSlide .3s ease; }
.tab-content.active { display: block; }
@keyframes fadeSlide { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* Overview Panel */
.overview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 14px; margin-bottom: 28px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); padding: 18px 20px;
  border: 1px solid var(--line);
}
.stat-card .stat-num { font-size: 2.2rem; font-weight: 700; line-height: 1; }
.stat-card .stat-label { color: var(--muted); font-size: .82rem; margin-top: 6px; }
.progress-section { margin-bottom: 28px; }
.progress-section h2 { font-size: 1.1rem; margin-bottom: 14px; color: var(--muted); }
.progress-bar-row { display: grid; grid-template-columns: 100px 1fr 50px; align-items: center; gap: 12px; margin-bottom: 8px; }
.progress-bar-row .name { font-size: .85rem; font-weight: 600; }
.progress-track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: inherit; transition: width .5s ease; }
.progress-bar-row .pct { font-size: .78rem; color: var(--muted); text-align: right; }

/* Character grid / cards */
.char-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px,1fr)); gap: 16px; }
.char-card {
  background: var(--card); border-radius: var(--radius); border: 1px solid var(--line);
  padding: 20px; transition: border-color .2s, box-shadow .2s; cursor: pointer;
  position: relative; overflow: hidden;
}
.char-card:hover { border-color: var(--accent-serena); box-shadow: var(--shadow); }
.char-card::before {
  content: ""; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
}
.char-card.lia::before { background: var(--accent-lia); }
.char-card.mia::before { background: var(--accent-mia); }
.char-card.serena::before { background: var(--accent-serena); }
.char-card.freya::before { background: var(--accent-freya); }
.char-card.lilith::before { background: var(--accent-lilith); }
.char-card.evelyn::before { background: var(--accent-evelyn); }
.char-card.ophelia::before { background: var(--accent-ophelia); }
.char-card.ayla::before { background: var(--accent-ayla); }

.char-card h3 { font-size: 1.15rem; margin-bottom: 2px; }
.char-card .title-badge { display: inline-block; font-size: .72rem; padding: 2px 10px; border-radius: 99px; margin-bottom: 10px; }
.char-card .meta-row { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); margin-bottom: 10px; }
.char-card .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
.char-card .tag {
  font-size: .71rem; padding: 3px 10px; border-radius: 99px;
  background: rgba(255,255,255,.06); color: var(--muted);
}
.char-card .bio { font-size: .83rem; color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.char-card .card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.char-card .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.char-card .status-dot.complete { background: var(--success); }
.char-card .status-dot.in-progress { background: var(--warn); }
.char-card .status-dot.not-started { background: var(--faint); }

/* Detail section (expanded in tab) */
.detail-panel {
  background: var(--card); border-radius: var(--radius); border: 1px solid var(--line);
  padding: 28px; margin-top: 16px;
}
.detail-panel h2 { font-size: 1.3rem; margin-bottom: 18px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px,1fr)); gap: 14px; }
.detail-item { }
.detail-item .label { font-size: .72rem; color: var(--faint); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
.detail-item .value { font-size: .9rem; }
.mood-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.mood-pill { font-size: .76rem; padding: 4px 12px; border-radius: 99px; background: rgba(255,255,255,.06); }

/* Art Table */
.art-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
.art-table th, .art-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); }
.art-table th { color: var(--faint); font-weight: 600; font-size: .76rem; text-transform: uppercase; letter-spacing: .5px; }
.art-table .status-badge { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: .74rem; font-weight: 600; }
.art-table .status-badge.complete { background: rgba(74,222,128,.15); color: var(--success); }
.art-table .status-badge.in-progress { background: rgba(251,191,36,.15); color: var(--warn); }
.art-table .status-badge.not-started { background: rgba(255,255,255,.05); color: var(--faint); }
.art-table select {
  background: var(--surface); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: .8rem; cursor: pointer;
}

/* Milestone Timeline */
.milestone-timeline { position: relative; padding-left: 32px; }
.milestone-timeline::before {
  content: ""; position: absolute; left: 10px; top: 0; bottom: 0;
  width: 2px; background: var(--line);
}
.milestone-item {
  position: relative; margin-bottom: 20px; padding: 14px 18px;
  background: var(--card); border-radius: var(--radius); border: 1px solid var(--line);
}
.milestone-item::before {
  content: ""; position: absolute; left: -26px; top: 18px;
  width: 12px; height: 12px; border-radius: 50%; background: var(--accent-serena);
  border: 3px solid var(--bg);
}
.milestone-item .ms-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.milestone-item .ms-phase { font-size: .78rem; padding: 3px 10px; border-radius: 99px; }
.milestone-item .ms-phase.design { background: rgba(181,140,255,.15); color: var(--accent-serena); }
.milestone-item .ms-phase.lineart { background: rgba(94,215,255,.15); color: var(--accent-mia); }
.milestone-item .ms-phase.coloring { background: rgba(255,107,124,.15); color: var(--accent-lia); }
.milestone-item .ms-phase.final { background: rgba(74,222,128,.15); color: var(--success); }
.milestone-item .ms-phase.vfx { background: rgba(250,204,21,.15); color: var(--accent-evelyn); }
.milestone-item .ms-phase.integration { background: rgba(244,114,182,.15); color: var(--accent-ophelia); }
.milestone-item .ms-date { font-size: .76rem; color: var(--faint); }
.milestone-item .ms-chars { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.milestone-item .ms-char-tag { font-size: .7rem; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,.08); }
.milestone-item .ms-note { font-size: .8rem; color: var(--muted); margin-top: 8px; }

/* Relationship Graph */
.relation-graph { position: relative; width: 100%; min-height: 500px; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
.relation-legend { display: flex; gap: 16px; justify-content: center; padding: 12px; border-bottom: 1px solid var(--line); font-size: .8rem; color: var(--muted); }
.relation-legend span { display: flex; align-items: center; gap: 5px; }
.relation-legend .leg-line { width: 20px; height: 2px; }
.relation-legend .leg-line.sister { background: var(--accent-ophelia); }
.relation-legend .leg-line.bond { background: var(--accent-serena); }
.relation-legend .leg-line.rival { background: var(--accent-lia); }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
  z-index: 100; justify-content: center; align-items: flex-start; padding-top: 40px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); border-radius: 16px; border: 1px solid var(--line);
  width: min(700px, 95vw); max-height: 85vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 18px 22px; border-bottom: 1px solid var(--line);
}
.modal-header h2 { font-size: 1.15rem; }
.modal-body { padding: 22px; }
.modal-body label { display: block; font-size: .78rem; color: var(--muted); margin-bottom: 4px; margin-top: 14px; }
.modal-body input, .modal-body textarea, .modal-body select {
  width: 100%; padding: 10px 14px; border-radius: 8px;
  background: var(--bg); color: var(--text); border: 1px solid var(--line);
  font-size: .88rem; font-family: inherit;
}
.modal-body textarea { min-height: 80px; resize: vertical; }
.modal-body input:focus, .modal-body textarea:focus, .modal-body select:focus { outline: none; border-color: var(--accent-serena); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 16px 22px; border-top: 1px solid var(--line); }
.modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

/* Filter bar */
.filter-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
.filter-bar input { padding: 8px 14px; border-radius: 99px; background: var(--surface); color: var(--text); border: 1px solid var(--line); font-size: .84rem; min-width: 200px; }
.filter-bar input:focus { outline: none; border-color: var(--accent-serena); }
.filter-bar select { padding: 8px 12px; border-radius: 99px; background: var(--surface); color: var(--text); border: 1px solid var(--line); font-size: .84rem; cursor: pointer; }

/* Toast */
.toast { position: fixed; bottom: 24px; right: 24px; padding: 12px 22px; border-radius: 99px; background: var(--success); color: #000; font-weight: 600; font-size: .86rem; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; }
.toast.show { opacity: 1; }

/* Responsive */
@media (max-width: 768px) {
  .char-grid { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
  .modal-row { grid-template-columns: 1fr; }
  .art-table { font-size: .74rem; }
  .art-table th, .art-table td { padding: 8px 6px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>月蚀契约 · <span>角色管理系统</span></h1>
    <div class="header-actions">
      <button class="button primary" onclick="openCharModal()">+ 新增角色</button>
      <button class="button" onclick="exportData()">导出 JSON</button>
      <button class="button small" onclick="importData()">导入</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('overview')">概览</button>
    <button class="tab-btn" onclick="switchTab('characters')">角色设定</button>
    <button class="tab-btn" onclick="switchTab('art')">美术资源</button>
    <button class="tab-btn" onclick="switchTab('milestones')">里程碑</button>
    <button class="tab-btn" onclick="switchTab('relations')">关系图</button>
  </div>

  <!-- ===== OVERVIEW ===== -->
  <div id="tab-overview" class="tab-content active"></div>

  <!-- ===== CHARACTERS ===== -->
  <div id="tab-characters" class="tab-content">
    <div class="filter-bar">
      <input type="text" id="charSearch" placeholder="搜索角色名/职业/特征..." oninput="renderCharacters()">
      <select id="charFilter" onchange="renderCharacters()">
        <option value="">全部角色</option>
      </select>
    </div>
    <div class="char-grid" id="charGrid"></div>
    <div id="charDetail" class="detail-panel" style="display:none"></div>
  </div>

  <!-- ===== ART ===== -->
  <div id="tab-art" class="tab-content">
    <div class="filter-bar">
      <select id="artFilterChar" onchange="renderArtTable()"><option value="">全部角色</option></select>
      <select id="artFilterStatus" onchange="renderArtTable()">
        <option value="">全部状态</option>
        <option value="complete">已完成</option>
        <option value="in-progress">进行中</option>
        <option value="not-started">未开始</option>
      </select>
    </div>
    <div style="overflow-x:auto;"><table class="art-table" id="artTable"></table></div>
  </div>

  <!-- ===== MILESTONES ===== -->
  <div id="tab-milestones" class="tab-content">
    <div style="display:flex; gap:8px; margin-bottom:16px;">
      <button class="button primary small" onclick="addMilestone()">+ 添加里程碑</button>
    </div>
    <div class="milestone-timeline" id="milestoneList"></div>
  </div>

  <!-- ===== RELATIONS ===== -->
  <div id="tab-relations" class="tab-content">
    <div class="relation-graph" id="relationGraph"></div>
    <div class="relation-legend">
      <span><span class="leg-line sister"></span> 姐妹关系</span>
      <span><span class="leg-line bond"></span> 羁绊羁绊</span>
      <span><span class="leg-line rival"></span> 竞争/张力</span>
    </div>
  </div>
</div>

<!-- Character Modal -->
<div class="modal-overlay" id="charModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">编辑角色</h2>
      <button class="button small" onclick="closeCharModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions">
      <button class="button danger small" id="modalDelete" style="display:none;margin-right:auto" onclick="deleteCharacter()">删除角色</button>
      <button class="button" onclick="closeCharModal()">取消</button>
      <button class="button primary" onclick="saveCharacter()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ DATA STORE ============
const STORAGE_KEY = 'moonlit_char_manager';

const DEFAULT_CHARACTERS = [
  {
    id: 'lia', name: '莉亚·赫斯特', nameEn: 'Lia Hest', age: 24, height: '172cm',
    hair: '赤红高马尾，左侧一缕暗红挑染（旧王都火灾疤发色）', eyes: '琥珀金',
    profession: '赤誓骑士 / 前卫破甲', element: '火·契约',
    personality: '嘴硬心软、重视承诺、毒舌急性子。表面用命令口吻和挖苦遮掩温柔，最怕被别人安慰（因为安慰让她想起没能救下的人）。自称\"不会再让任何人死在我面前\"。',
    quirks: ['害羞时别过脸整理肩甲绝不承认', '被夸奖会说\"闭嘴\"但耳朵红', '独自巡逻时低声念已故同伴的名字'],

    likes: ['守信用的人', '好剑', '月光下的火车车厢顶'],

    relations: [
      { target: 'mia', type: 'bond', desc: '总嫌她吵，但会默默帮她修工具' },
      { target: 'serena', type: 'rival', desc: '互不主动示弱的竞技场，其实互相欣赏' }
    ]
  },
  {
    id: 'mia', name: '米娅·铃', nameEn: 'Mia Lin', age: 21, height: '158cm',
    hair: '青蓝短发，发尾霓虹渐变，右边别扳手形发卡', eyes: '亮青色（瞳孔有淡淡电路反光）',

    likes: ['拆开又装回去的东西', '咖啡因', '被认真倾听'],
    dislikes: ['别人动她的螺丝刀', '被当成小孩子', '狗（\"它们总想咬我的耳朵！\"）'],
    relations: [
      { target: 'lia', type: 'bond', desc: '嘴上嫌弃骑士太死板，但改装炉心时第一个喊莉亚来看' },

  {

    playerInteraction: '在意玩家是否诚实，胜过在意玩家对她好不好。突然说\"你在撒谎\"时不用害怕——她只是在测试。调戏她会被反问\"你确定你准备好了吗\"（然后她轻轻笑了）。',
    likes: ['真相（无论多残酷）', '新月之夜', '安静的人'],
    dislikes: ['谎言', '喧哗', '被问\"你在想什么\"'],
    relations: [
      { target: 'lia', type: 'rival', desc: '互相不先低头，但战时会为对方展开最强结界' },

  },
  {
    id: 'freya', name: '芙蕾娅·霜华', nameEn: 'Freya Frostbloom', age: 23, height: '166cm',

// ============ STATE ============
let characters = [];
let artStatus = {};  // { charId: { artType: 'not-started'|'in-progress'|'complete' } }
let milestones = [];
let editingCharId = null;

function loadData() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) {
    try {
      const data = JSON.parse(raw);
      characters = data.characters || DEFAULT_CHARACTERS;
      artStatus = data.artStatus || {};
      milestones = data.milestones || DEFAULT_MILESTONES;
    } catch(e) { initDefaults(); }
  } else { initDefaults(); }
  // Ensure all characters and art types exist
  characters.forEach(c => {
    if (!artStatus[c.id]) artStatus[c.id] = {};
    ART_TYPES.forEach(t => {
      if (!artStatus[c.id][t]) artStatus[c.id][t] = 'not-started';
    });
  });
}

function initDefaults() {
  characters = JSON.parse(JSON.stringify(DEFAULT_CHARACTERS));
  artStatus = {};
  milestones = JSON.parse(JSON.stringify(DEFAULT_MILESTONES));
  saveData();
}

function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ characters, artStatus, milestones }));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function getCharById(id) { return characters.find(c => c.id === id); }
function getCharAccent(id) {
  const map = { lia:'#ff6b7c', mia:'#5ed7ff', serena:'#b58cff', freya:'#8fd4f5', lilith:'#c084fc', evelyn:'#facc15', ophelia:'#f472b6', ayla:'#fbbf24' };
  return map[id] || '#8b87a8';
}

// ============ TAB SWITCHING ============
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.querySelector(`.tab-btn:nth-child(${{overview:1,characters:2,art:3,milestones:4,relations:5}[tab]})`).classList.add('active');
  document.getElementById(`tab-${tab}`).classList.add('active');

  if (tab === 'overview') renderOverview();
  if (tab === 'characters') renderCharacters();
  if (tab === 'art') renderArtTable();
  if (tab === 'milestones') renderMilestones();
  if (tab === 'relations') renderRelationGraph();
}

// ============ OVERVIEW ============
function renderOverview() {
  const total = characters.length;
  const completed = Object.values(artStatus).filter(a => ART_TYPES.every(t => a[t] === 'complete')).length;
  const inProgress = Object.values(artStatus).filter(a => ART_TYPES.some(t => a[t] === 'in-progress') && !ART_TYPES.every(t => a[t] === 'complete')).length;
  const completedMS = milestones.filter(m => m.date).length;
  const totalMS = milestones.length;

  document.getElementById('tab-overview').innerHTML = `
    <div class="overview-grid">
      <div class="stat-card"><div class="stat-num">${total}</div><div class="stat-label">角色总数</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--success)">${completed}</div><div class="stat-label">美术全部完成</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--warn)">${inProgress}</div><div class="stat-label">美术进行中</div></div>
      <div class="stat-card"><div class="stat-num" style="color:var(--accent-serena)">${completedMS}/${totalMS}</div><div class="stat-label">里程碑达成</div></div>
    </div>
    <div class="progress-section">
      <h2>角色美术进度</h2>
      ${characters.map(c => {
        const total = ART_TYPES.length;
        const done = ART_TYPES.filter(t => artStatus[c.id]?.[t] === 'complete').length;
        const pct = Math.round(done / total * 100);
        return `<div class="progress-bar-row">
          <span class="name" style="color:${getCharAccent(c.id)}">${c.name}</span>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:${getCharAccent(c.id)}"></div></div>
          <span class="pct">${done}/${total}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="progress-section">
      <h2>最新里程碑</h2>
      <div class="milestone-timeline">
        ${milestones.filter(m => m.date).slice(-4).reverse().map(m => `
          <div class="milestone-item">
            <div class="ms-header"><span class="ms-phase ${m.phase}">${m.phaseLabel}</span><span class="ms-date">${m.date}</span></div>
            <div class="ms-chars">${m.chars.map(cid => {
              const cc = getCharById(cid);
              return cc ? `<span class="ms-char-tag" style="border-left:2px solid ${getCharAccent(cid)}">${cc.name}</span>` : '';
            }).join('')}</div>
            <div class="ms-note">${m.note}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

// ============ CHARACTERS ============
function renderCharacters() {
  const search = (document.getElementById('charSearch')?.value || '').toLowerCase();
  const filter = document.getElementById('charFilter')?.value || '';
  let filtered = characters;
  if (search) filtered = filtered.filter(c => c.name.includes(search) || c.profession.includes(search) || c.personality.includes(search));
  if (filter) filtered = filtered.filter(c => c.id === filter);

  document.getElementById('charFilter').innerHTML = '<option value="">全部角色</option>' + characters.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

  document.getElementById('charGrid').innerHTML = filtered.map(c => {
    const done = ART_TYPES.filter(t => artStatus[c.id]?.[t] === 'complete').length;
    const total = ART_TYPES.length;
    const status = done === total ? 'complete' : done > 0 ? 'in-progress' : 'not-started';
    const statusText = done === total ? '全部完成' : done > 0 ? `${done}/${total}` : '未开始';
    return `<div class="char-card ${c.id}" onclick="showCharDetail('${c.id}')">
      <h3 style="color:${getCharAccent(c.id)}">${c.name}</h3>
      <div class="title-badge" style="background:${getCharAccent(c.id)}22;color:${getCharAccent(c.id)}">${c.profession}</div>
      <div class="meta-row"><span>年龄 ${c.age}</span><span>${c.height}</span><span>${c.element}</span></div>
      <div class="tags">${c.quirks.slice(0,2).map(q => `<span class="tag">${q.slice(0,16)}…</span>`).join('')}</div>
      <div class="bio">${c.personality.slice(0,90)}…</div>
      <div class="card-footer">
        <span style="color:${getCharAccent(c.id)};font-weight:600;">${c.nameEn}</span>
        <span><span class="status-dot ${status}"></span>${statusText}</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('charDetail').style.display = 'none';
}

    hair: document.getElementById('f_hair').value.trim(),
    eyes: document.getElementById('f_eyes').value.trim(),
    personality: document.getElementById('f_personality').value.trim(),
    quirks: document.getElementById('f_quirks').value.split('\n').filter(Boolean),
    playerInteraction: document.getElementById('f_playerInteraction').value.trim(),
    likes: document.getElementById('f_likes').value.split('、').filter(Boolean),
    dislikes: document.getElementById('f_dislikes').value.split('、').filter(Boolean),
    relations: editingCharId ? (getCharById(editingCharId)?.relations || []) : []
  };
  if (editingCharId) {
    const idx = characters.findIndex(c => c.id === editingCharId);
    if (idx >= 0) characters[idx] = data;
  } else {
    characters.push(data);
    artStatus[id] = {};
    ART_TYPES.forEach(t => artStatus[id][t] = 'not-started');
  }
  saveData();
  closeCharModal();
  renderCharacters();
  showToast(editingCharId ? '已更新' : '已新增');
}

function deleteCharacter() {
  if (!editingCharId) return;
  if (!confirm(`确定删除 ${getCharById(editingCharId)?.name} ？此操作不可撤销。`)) return;
  characters = characters.filter(c => c.id !== editingCharId);
  delete artStatus[editingCharId];
  saveData();
  closeCharModal();
  renderCharacters();
  showToast('已删除');
}

// ============ ART TABLE ============
function renderArtTable() {
  const filterChar = document.getElementById('artFilterChar')?.value || '';
  const filterStatus = document.getElementById('artFilterStatus')?.value || '';
  let filtered = characters;
  if (filterChar) filtered = filtered.filter(c => c.id === filterChar);

  document.getElementById('artFilterChar').innerHTML = '<option value="">全部角色</option>' + characters.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

  let rows = '';
  filtered.forEach(c => {
    ART_TYPES.forEach(t => {
      const s = artStatus[c.id]?.[t] || 'not-started';
      if (filterStatus && s !== filterStatus) return;
      const statusLabel = { 'complete': '已完成', 'in-progress': '进行中', 'not-started': '未开始' }[s];
      rows += `<tr>
        <td style="font-weight:600;color:${getCharAccent(c.id)}">${c.name}</td>
        <td>${t}</td>
        <td><span class="status-badge ${s}">${statusLabel}</span></td>
        <td><select onchange="updateArtStatus('${c.id}','${t}',this.value)">
          <option value="not-started" ${s==='not-started'?'selected':''}>未开始</option>
          <option value="in-progress" ${s==='in-progress'?'selected':''}>进行中</option>
          <option value="complete" ${s==='complete'?'selected':''}>已完成</option>
        </select></td>
      </tr>`;
    });
  });

  document.getElementById('artTable').innerHTML = `
    <thead><tr><th>角色</th><th>资源类型</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:var(--faint);padding:30px;">无匹配结果</td></tr>'}</tbody>
  `;
}

function updateArtStatus(charId, artType, value) {
  if (!artStatus[charId]) artStatus[charId] = {};
  artStatus[charId][artType] = value;
  saveData();
  showToast(value === 'complete' ? '✓ 已标记完成' : value === 'in-progress' ? '● 进行中' : '○ 未开始');
}

// ============ MILESTONES ============
function renderMilestones() {
  const phaseColors = { design: 'var(--accent-serena)', lineart: 'var(--accent-mia)', coloring: 'var(--accent-lia)', final: 'var(--success)', vfx: 'var(--accent-evelyn)', integration: 'var(--accent-ophelia)' };
  document.getElementById('milestoneList').innerHTML = milestones.map((m, i) => `
    <div class="milestone-item">
      <div class="ms-header">
        <span class="ms-phase ${m.phase}">${m.phaseLabel}</span>
        <span class="ms-date">${m.date || '未排期'}</span>
        <button class="button small danger" style="margin-left:auto" onclick="milestones.splice(${i},1);saveData();renderMilestones();showToast('已删除里程碑')">✕</button>
      </div>
      <div class="ms-chars">${m.chars.map(cid => {
        const cc = getCharById(cid);
        return cc ? `<span class="ms-char-tag" style="border-left:2px solid ${getCharAccent(cid)}">${cc.name}</span>` : '';
      }).join('')}</div>
      <div class="ms-note">${m.note}</div>
    </div>
  `).join('');
}

function addMilestone() {
  const phase = prompt('阶段 (design / lineart / coloring / final / vfx / integration):', 'lineart');
  if (!phase) return;
  const phaseLabels = { design:'角色设定确认', lineart:'线稿', coloring:'上色', final:'最终定稿', vfx:'动作/特效', integration:'整合测试' };
  const charList = prompt('关联角色ID（逗号分隔，如 lia,mia,serena）:', characters.map(c => c.id).join(','));
  if (!charList) return;
  const note = prompt('备注:', '');
  const date = prompt('完成日期 (YYYY-MM-DD，留空=未排期):', '');
  milestones.push({
    id: 'm' + Date.now(),
    phase,
    phaseLabel: phaseLabels[phase] || phase,
    date: date || null,
    chars: charList.split(',').map(s => s.trim()).filter(Boolean),
    note: note || ''
  });
  saveData();
  renderMilestones();
  showToast('里程碑已添加');
}

// ============ RELATION GRAPH ============
function renderRelationGraph() {
  const svg = document.getElementById('relationGraph');
  const W = svg.clientWidth || 800;
  const H = 520;
  const cx = W / 2, cy = H / 2;
  const radius = Math.min(W, H) * 0.35;

  // Positions: circle layout
  const positions = {};
  characters.forEach((c, i) => {
    const angle = (i / characters.length) * Math.PI * 2 - Math.PI / 2;
    positions[c.id] = {
      x: cx + Math.cos(angle) * radius,
      y: cy + Math.sin(angle) * radius
    };
  });

  // Collect all relations
  const allRelations = [];
  const seen = new Set();
  characters.forEach(c => {
    (c.relations || []).forEach(r => {
      const key = [c.id, r.target].sort().join('-') + '-' + r.type;
      if (!seen.has(key)) {
        seen.add(key);
        allRelations.push({ from: c.id, to: r.target, type: r.type, desc: r.desc });
      }
    });
  });

  const typeColors = { sister: 'var(--accent-ophelia)', bond: 'var(--accent-serena)', rival: 'var(--accent-lia)' };
  const typeWidths = { sister: 2.5, bond: 1.8, rival: 1.5 };
  const typeDash = { sister: 'none', bond: 'none', rival: '6,4' };

  svg.innerHTML = `
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" height="${H}">
      <defs>
        <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <rect width="100%" height="100%" fill="transparent"/>
      ${allRelations.map(r => {
        const p1 = positions[r.from], p2 = positions[r.to];
        if (!p1 || !p2) return '';
        const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
        return `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}"
          stroke="${typeColors[r.type]}" stroke-width="${typeWidths[r.type]}" stroke-dasharray="${typeDash[r.type]}" opacity=".6"/>
        <text x="${mx}" y="${my}" text-anchor="middle" font-size="10" fill="${typeColors[r.type]}" opacity=".8" dy="-4">${r.desc.slice(0,12)}</text>`;
      }).join('')}
      ${characters.map(c => {
        const p = positions[c.id];
        const accent = getCharAccent(c.id);
        return `<g transform="translate(${p.x},${p.y})" style="cursor:pointer" onclick="showCharDetail('${c.id}')">
          <circle r="28" fill="${accent}" opacity=".18"/>
          <circle r="22" fill="var(--bg)" stroke="${accent}" stroke-width="2.5"/>
          <text y="5" text-anchor="middle" font-size="13" fill="${accent}" filter="url(#glow)">${c.name.slice(0,2)}</text>
          <text y="44" text-anchor="middle" font-size="10" fill="var(--muted)">${c.nameEn}</text>
        </g>`;
      }).join('')}
    </svg>
  `;
}

// ============ EXPORT / IMPORT ============
function exportData() {
  const data = { characters, artStatus, milestones, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `moonlit-characters-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出 JSON');
}

function importData() {
  document.getElementById('importFile').click();
}

function handleImport(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.characters && data.artStatus && data.milestones) {
        characters = data.characters;
        artStatus = data.artStatus;
        milestones = data.milestones;
        saveData();
        refreshAll();
        showToast('导入成功！');
      } else {
        showToast('无效的导入文件格式');
      }
    } catch(err) {
      showToast('JSON 解析失败');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function refreshAll() {
  renderOverview();
  renderCharacters();
  renderArtTable();
  renderMilestones();
  if (document.getElementById('tab-relations').classList.contains('active')) renderRelationGraph();
}

// ============ INIT ============
loadData();
document.getElementById('relationGraph').addEventListener('DOMNodeInserted', function(){});
renderOverview();
window.addEventListener('resize', () => {
  if (document.getElementById('tab-relations').classList.contains('active')) renderRelationGraph();
});

// Keyboard: Escape closes modal
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeCharModal();
});
document.getElementById('charModal').addEventListener('click', function(e) {
  if (e.target === this) closeCharModal();
});
</script>
