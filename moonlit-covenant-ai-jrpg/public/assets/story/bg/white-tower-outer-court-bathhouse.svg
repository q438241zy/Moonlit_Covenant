<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="白塔·外庭浴场·蒸汽：外庭东边的旧浴场里面；中间偏右是石砌的下沉浴池，一池热水；浴池左端前面立着一道三折的高木屏风，后面的灯把它照得发亮；左边门旁的木架上叠着浴巾，横杆上挂着两条；右墙的木钉上也挂着浴巾；右后角是烧得发红的铁炉和一摞柴；墙上几盏灯；满屋蒸汽；没有人">
