<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="雾港·旧灯塔·灯室·夜雨：旧灯塔顶上的灯室，最后几级石阶从地板的方口升上来，口下透出一点暖光；中央的铁透镜架空着，没有透镜；一圈高窗只剩窗框、没有玻璃，窗外是夜雨与黑色的水面，对岸是一排低矮的木屋顶；没有人">
