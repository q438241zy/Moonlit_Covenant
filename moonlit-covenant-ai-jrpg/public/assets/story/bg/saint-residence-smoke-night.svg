<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="圣女居所·夜·烟：从街上正面看白石两层的居所；一楼左边书库的木门前，一排晨星卫举着盾站成一行（剪影）；右边敞开的楼梯间，石阶往上，黑色的烟顺着石阶往下滚；二楼窗里的灯被烟遮住，一扇窗的玻璃上按着一只手掌；屋顶边上三个穿白袍的人影往外走；黑、白、暗金，烟是黑的不是灰的，不画脸">
