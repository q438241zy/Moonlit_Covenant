<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="北山营地·登记帐篷：中柱撑起的帆布帐篷，后面的门帘系开，外面是晴朗的早晨、坡地、几顶帐篷、麦田平原和地平线上很小的一座钟塔；近处一张长条桌，摊着一本厚登记簿（只有格线和小勾）、墨水瓶和羽毛笔、一本系着丝带的小簿子、几张散纸，桌后一条长凳，角落一箱撕下来的册页，柱上挂着一盏提灯；不画人，不写字">
