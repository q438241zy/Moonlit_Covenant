<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="白塔·七角殿：七角形的石殿，七张椅子各对一个角，每把椅子后面一面旗——晨星、赤焰、铸金、霜潮、翠影、夜鸦、龙脊（盘着的龙）；殿的正中一张矮桌，桌上一本册；墙上嵌着高窄的窗和镜面；晨星卫沿着墙站成一圈（剪影）；冷白和七种颜色，不画人脸">
