<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="白塔圣都·晨门·黄昏：同一座白石城门，光从门洞斜斜照进来；长桌上的兵器少了，只剩红色塔盾与盾上的短剑、包着布的杖、旧剑和圆形的小机械；台阶上坐着一个戴帽子的男人的剪影，看不见脸；门洞里远处的白塔染成橙色，塔顶没入云里">
