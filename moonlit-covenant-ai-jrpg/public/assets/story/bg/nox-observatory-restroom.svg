<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="诺克斯观测所·休整室：地下观测所里一间观测员的休息室，白墙被油灯照成暖褐色；几张简易行军床上叠着灰毛毯，桌上一盏油灯是唯一的光，墙上钉着一张泛黄的旧星图，衣钩上挂着一件旧观测袍，门缝底下漏进一线金光；温暖但疲惫，没有人">
